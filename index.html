<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<title>PALM | البث التلفزيوني العالمي</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    fontFamily: { sans: ['Alexandria', 'sans-serif'] },
    colors: {
      night: '#09090b', panel: '#121214', card: '#1a1a1d',
      indigo: { 400:'#818cf8', 500:'#6366f1', 600:'#4f46e5' }
    }
  }}
};
</script>
<style>
:root { color-scheme: dark; --bg:#000000; --panel:#121214; --card:#1a1a1d; --text:#f4f4f5; --muted:#9696a0; --border:rgba(255,255,255,0.06); }
html.light { color-scheme:light; --bg:#f6f8fa; --panel:#ffffff; --card:#f0f2f5; --text:#111827; --muted:#6b7280; --border:rgba(0,0,0,0.06); }
* { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body { font-family:'Alexandria',sans-serif; background:var(--bg); color:var(--text); }
.surface { background:var(--panel); border:1px solid var(--border); }
.card-surface { background:var(--card); border:1px solid var(--border); }
.muted { color:var(--muted); }
::-webkit-scrollbar { width:4px;height:4px; }
::-webkit-scrollbar-thumb { background:var(--muted);border-radius:10px; opacity:0.3; }
button,input,select { font:inherit; }
button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid #6366f1;outline-offset:2px; }
.channel-strip { transition: transform .15s ease, background-color .15s ease; }
.channel-strip:hover { transform:translateX(-2px); }
.loader-ring { width:28px;height:28px;border:3px solid rgba(99,102,241,.15);border-top-color:#6366f1;border-radius:50%;animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#video-player { background:#000; }
.sticky-player { position: sticky; top: 70px; z-index: 40; }
</style>
</head>

<body class="min-h-screen">
<header class="sticky top-0 z-50 surface/90 backdrop-blur-xl border-b px-4 md:px-6">
  <div class="max-w-7xl mx-auto h-[58px] flex items-center justify-between gap-4">
    <a href="#" class="flex items-center gap-2.5 min-w-0" onclick="resetToHome()">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 text-white flex items-center justify-center shadow-md">
        <i class="fa-solid fa-satellite-dish text-xs"></i>
      </div>
      <div>
        <div class="text-sm font-bold tracking-wide">PALM <span class="text-indigo-500">TV</span></div>
        <div class="text-[9px] muted -mt-1 font-medium">بث عالمي خفيف</div>
      </div>
    </a>
    <div class="flex items-center gap-2">
      <button id="theme-toggle" class="w-8 h-8 rounded-full card-surface hover:border-indigo-500 transition flex items-center justify-center" aria-label="تغيير المظهر">
        <i id="theme-icon" class="fa-solid fa-sun text-xs"></i>
      </button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto w-full px-3 sm:px-5 py-3.5">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-3.5 items-start">
    
    <!-- المشغل (ثابت) -->
    <div class="lg:col-span-7 xl:col-span-8 sticky-player space-y-3">
      
      <!-- ترحيب خفيف -->
      <section id="intro-section" class="relative overflow-hidden rounded-2xl p-3.5 surface flex items-center justify-between">
        <div>
          <h1 class="text-sm font-bold">عالم التلفزيون، <span class="text-indigo-500">بين أيدكم</span></h1>
          <p class="text-[10px] muted mt-0.5 font-medium">اختر دولتك واستمتع بالمشاهدة بسلاسة.</p>
        </div>
        <div class="hidden sm:flex gap-1.5">
          <div class="card-surface rounded-xl px-2.5 py-1.5 text-center">
            <div class="text-[8px] muted">الدول</div><div id="stat-countries" class="text-xs font-bold text-indigo-500">—</div>
          </div>
          <div class="card-surface rounded-xl px-2.5 py-1.5 text-center">
            <div class="text-[8px] muted">القنوات</div><div id="stat-channels" class="text-xs font-bold text-indigo-500">—</div>
          </div>
        </div>
      </section>

      <!-- شاشة المشغل -->
      <section id="player-section" class="surface rounded-2xl p-2.5 shadow-lg">
        <div class="flex flex-wrap items-center justify-between gap-2 px-1.5 pb-2">
          <div class="flex items-center gap-2 min-w-0">
            <div class="w-7 h-7 rounded-full bg-rose-500/10 text-rose-500 flex items-center justify-center text-[10px]"><i class="fa-solid fa-tower-broadcast"></i></div>
            <div class="min-w-0">
              <div class="flex items-center gap-1 text-[9px] font-bold muted"><span class="w-1.5 h-1.5 bg-rose-500 rounded-full animate-pulse"></span> بث مباشر</div>
              <div id="current-channel-tag" class="text-xs font-semibold truncate text-indigo-500">اختر قناة لبدء المشاهدة</div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button id="refresh-player" class="hidden text-[11px] px-2 py-1 rounded-lg card-surface hover:border-indigo-500 transition font-medium flex items-center gap-1" title="تحديث البث">
              <i class="fa-solid fa-rotate text-indigo-500 text-[10px]"></i><span>تحديث</span>
            </button>
            <button id="favorite-current" class="hidden text-[11px] px-2 py-1 rounded-lg card-surface hover:border-indigo-500 transition font-medium flex items-center gap-1">
              <i id="favorite-current-icon" class="fa-regular fa-heart text-rose-500"></i><span id="favorite-current-label">المفضلة</span>
            </button>
            <button id="stop-player" class="text-[11px] px-2 py-1 rounded-lg card-surface hover:border-rose-400 transition font-medium flex items-center gap-1 text-rose-500" title="إيقاف البث">
              <i class="fa-solid fa-stop text-[10px]"></i><span>إيقاف</span>
            </button>
          </div>
        </div>
        <div class="relative aspect-video bg-black rounded-xl overflow-hidden shadow-inner border border-white/5">
          <video id="video-player" class="w-full h-full object-contain" controls playsinline></video>
          <div id="player-overlay" class="absolute inset-0 flex items-center justify-center bg-black/85 p-4 text-center backdrop-blur-sm transition-opacity">
            <div class="max-w-sm">
              <div class="w-10 h-10 rounded-full bg-indigo-500/15 text-indigo-400 flex items-center justify-center text-sm mx-auto mb-2 border border-indigo-500/10"><i class="fa-solid fa-play"></i></div>
              <h2 class="text-white text-xs font-bold">جاهز للمشاهدة؟</h2>
              <p class="text-slate-400 text-[10px] mt-1 font-medium">اختر دولة ثم قناة من القائمة الجانبية.</p>
            </div>
          </div>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2 pt-2 px-1 text-[10px] muted font-medium">
          <span id="player-status" role="status" aria-live="polite">في انتظار اختيار قناة...</span>
          <span class="flex items-center gap-1"><i class="fa-solid fa-bolt text-indigo-500"></i> نظام تخطي ذكي</span>
        </div>
      </section>
    </div>

    <!-- القوائم والبحث -->
    <div class="lg:col-span-5 xl:col-span-4 space-y-3">
      
      <!-- شريط البحث والتبويبات -->
      <section class="surface rounded-2xl p-2.5 shadow-sm space-y-2">
        <div class="flex items-center gap-1 card-surface rounded-xl p-1 border">
          <button class="tab-btn flex-1 py-1 rounded-lg text-[11px] font-semibold bg-indigo-500 text-white shadow-sm transition" data-tab="countries">الدول</button>
          <button class="tab-btn flex-1 py-1 rounded-lg text-[11px] font-semibold muted hover:text-indigo-500 transition" data-tab="all">الكل</button>
          <button class="tab-btn flex-1 py-1 rounded-lg text-[11px] font-semibold muted hover:text-indigo-500 transition flex justify-center items-center gap-1" data-tab="favorites">
            <i class="fa-solid fa-heart text-rose-500 text-[9px]"></i>المفضلة (<span id="favorites-count">0</span>)
          </button>
        </div>
        <div class="relative w-full">
          <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 muted text-[10px]"></i>
          <input id="global-search" type="search" placeholder="ابحث عن قناة أو دولة..." class="w-full rounded-xl card-surface py-2 pr-8 pl-8 text-xs focus:border-indigo-500 outline-none font-medium">
          <button id="clear-global-search" class="hidden absolute left-2.5 top-1/2 -translate-y-1/2 muted hover:text-indigo-500 transition text-xs" aria-label="مسح"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </section>

      <!-- قائمة الدول -->
      <section id="countries-section" class="surface rounded-2xl p-3 shadow-sm">
        <div class="flex items-center justify-between gap-2 mb-2 px-1">
          <h2 class="font-bold text-xs">اختر الدولة</h2>
          <span id="countries-count" class="text-[10px] font-semibold bg-indigo-500/10 text-indigo-500 px-2 py-0.5 rounded-md"></span>
        </div>
        <div id="countries-list" class="grid grid-cols-2 gap-1.5 max-h-[54vh] overflow-y-auto pr-1">
          <div class="col-span-full py-6 text-center muted text-xs font-medium"><span class="loader-ring inline-block"></span><p class="mt-2">جاري التحميل...</p></div>
        </div>
      </section>

      <!-- قائمة القنوات -->
      <section id="channels-section" class="surface rounded-2xl p-3 hidden flex-col shadow-sm">
        <div class="flex items-center justify-between gap-2 mb-2.5 card-surface p-2 rounded-xl border">
          <div class="flex items-center gap-2 min-w-0">
            <button id="back-to-countries-btn" class="hidden w-7 h-7 shrink-0 rounded-full bg-indigo-500/10 hover:bg-indigo-500 hover:text-white text-indigo-500 flex items-center justify-center transition" title="الرجوع للدول">
              <i class="fa-solid fa-arrow-right text-[11px]"></i>
            </button>
            <div id="active-country-flag" class="text-lg shrink-0">📺</div>
            <div class="min-w-0">
              <h2 id="active-country-name" class="font-bold text-xs truncate">القنوات</h2>
              <p id="active-country-channels-count" class="text-[9px] muted truncate font-medium">تصفح القنوات</p>
            </div>
          </div>
        </div>

        <div class="flex gap-1.5 mb-2.5">
          <select id="category-filter" class="w-1/2 card-surface rounded-xl px-2 py-1.5 text-[10px] font-medium outline-none focus:border-indigo-500">
            <option value="">كل التصنيفات</option>
            <option value="news">أخبار</option><option value="sports">رياضة</option><option value="entertainment">ترفيه</option>
            <option value="movies">أفلام</option><option value="music">موسيقى</option><option value="kids">أطفال</option>
            <option value="education">تعليم</option><option value="religious">دينية</option>
          </select>
          <select id="sort-filter" class="w-1/2 card-surface rounded-xl px-2 py-1.5 text-[10px] font-medium outline-none focus:border-indigo-500">
            <option value="name">ترتيب أبجدي</option><option value="category">حسب التصنيف</option>
          </select>
        </div>

        <div id="channels-list-container" class="max-h-[50vh] overflow-y-auto pr-1">
          <div id="channels-list" class="flex flex-col gap-1.5"></div>
          <div id="channels-footer" class="hidden text-center pt-3 pb-1">
            <button id="load-more" class="w-full px-3 py-1.5 rounded-xl bg-indigo-500/10 text-indigo-500 hover:bg-indigo-500/20 text-xs font-bold transition">عرض المزيد</button>
            <p id="channels-page-info" class="text-[9px] muted mt-1 font-medium"></p>
          </div>
        </div>
      </section>

    </div>
  </div>
</main>

<div id="toast" class="fixed bottom-4 right-4 z-[100] hidden max-w-[90vw] rounded-xl surface px-3 py-2 text-xs shadow-xl flex items-center gap-2 font-medium" role="status">
  <i class="fa-solid fa-bell text-indigo-500 text-xs"></i> <span id="toast-msg"></span>
</div>

<script>
'use strict';

const API = {
  countries: 'https://iptv-org.github.io/api/countries.json',
  channels: 'https://iptv-org.github.io/api/channels.json',
  streams: 'https://iptv-org.github.io/api/streams.json'
};
const PAGE_SIZE = 35;
const $ = id => document.getElementById(id);

let countries = [];
let channels = [];
let streamsByChannel = new Map();
let countryMap = new Map();
let currentCountry = null;
let currentTab = 'countries';
let activeChannel = null;
let currentStreamIndex = 0;
let hls = null;
let visibleCount = PAGE_SIZE;
let favorites = readFavorites();
let toastTimer;
let streamTimeout; 

const regionNamesInArabic = new Intl.DisplayNames(['ar'], { type: 'region' });

function readFavorites() {
  try { return JSON.parse(localStorage.getItem('palm_favorites_v2') || '[]'); } catch { return []; }
}
function normalizeText(value='') {
  return String(value).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
}
function escapeHTML(value='') {
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function showToast(message) {
  $('toast-msg').textContent = message;
  $('toast').classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 2500);
}
function setStatus(message) { $('player-status').textContent = message; }
function setOverlay(title, message, loading=false) {
  const overlay = $('player-overlay');
  overlay.innerHTML = loading
    ? `<div class="text-center"><span class="loader-ring inline-block"></span><p class="text-white font-bold mt-2 text-xs">${escapeHTML(title)}</p><p class="text-indigo-200/70 text-[10px] mt-1 font-medium">${escapeHTML(message)}</p></div>`
    : `<div class="max-w-sm text-center"><div class="w-10 h-10 rounded-full bg-rose-500/10 text-rose-500 flex items-center justify-center text-base mx-auto mb-2 border border-rose-500/10"><i class="fa-solid fa-circle-exclamation"></i></div><p class="text-white font-bold text-xs">${escapeHTML(title)}</p><p class="text-slate-400 text-[10px] mt-1 font-medium">${escapeHTML(message)}</p></div>`;
  overlay.classList.remove('hidden');
}
function hideOverlay() { $('player-overlay').classList.add('hidden'); }

// دالة تفريغ حقل البحث وإعادة ضبط الفلترة بالكامل
function clearSearchInput() {
  const searchInput = $('global-search');
  if (searchInput) searchInput.value = '';
  $('clear-global-search').classList.add('hidden');
}

async function init() {
  try {
    setStatus('جاري تحميل القنوات...');
    const [countryData, channelData, streamData] = await Promise.all([
      fetchJSON(API.countries), fetchJSON(API.channels), fetchJSON(API.streams)
    ]);

    countryData.forEach(c => {
      let arabicName = c.name;
      try { arabicName = regionNamesInArabic.of(c.code) || c.name; } catch(e){}
      if (c.code === 'IL') arabicName = 'فلسطين المحتلة';
      countryMap.set(c.code, { code: c.code, name: arabicName, originalName: c.name, flag: c.flag || '🌐' });
    });

    streamData.forEach(stream => {
      if (!stream.channel || !stream.url) return;
      if (!streamsByChannel.has(stream.channel)) streamsByChannel.set(stream.channel, []);
      streamsByChannel.get(stream.channel).push(stream.url);
    });

    channels = channelData
      .filter(ch => ch.country && streamsByChannel.has(ch.id))
      .map(ch => ({...ch, name: ch.name || ch.id, categories: ch.categories || []}));

    countries = [...new Set(channels.map(ch => ch.country))]
      .map(code => countryMap.get(code)).filter(Boolean)
      .map(country => ({...country, count: channels.filter(ch => ch.country === country.code).length}))
      .sort((a,b) => b.count - a.count);

    $('stat-countries').textContent = countries.length;
    $('stat-channels').textContent = channels.length;

    renderCountries();
    updateFavoritesCount();
    setStatus('جاهز، اختر دولة للبدء');
  } catch (error) {
    $('countries-list').innerHTML = `<div class="col-span-full text-center text-rose-500 text-xs py-4 font-medium">فشل التحميل. <button onclick="init()" class="underline font-bold">إعادة المحاولة</button></div>`;
  }
}
async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'force-cache' });
  return await res.json();
}

function renderCountries(query='') {
  const q = normalizeText(query);
  const list = countries.filter(c => !q || normalizeText(`${c.name} ${c.originalName}`).includes(q));
  $('countries-count').textContent = list.length;
  
  if (!list.length) {
    $('countries-list').innerHTML = `<div class="col-span-full py-6 text-center muted text-xs font-medium card-surface rounded-xl">لا توجد دولة مطابقة.</div>`;
    return;
  }
  
  $('countries-list').innerHTML = list.map(c => `
    <button class="country-button card-surface rounded-xl p-2 text-right hover:border-indigo-500/40 transition border border-transparent flex items-center gap-2 group" data-country="${escapeHTML(c.code)}">
      <span class="text-xl group-hover:scale-110 transition-transform">${escapeHTML(c.flag)}</span>
      <div class="min-w-0">
        <div class="font-bold text-[11px] truncate group-hover:text-indigo-500 transition-colors">${escapeHTML(c.name)}</div>
        <div class="text-[9px] muted mt-0.5">${c.count} قناة</div>
      </div>
    </button>`).join('');
}

function chooseCountry(code) {
  // تفريغ حقل البحث وإعادة رسم الدول لتظهر كاملة لاحقاً عند الرجوع
  clearSearchInput();
  renderCountries(); 

  currentCountry = code;
  const country = countryMap.get(code);
  
  $('countries-section').classList.add('hidden');
  $('channels-section').classList.remove('hidden');
  $('channels-section').classList.add('flex');
  $('back-to-countries-btn').classList.remove('hidden');
  
  $('active-country-flag').textContent = country?.flag || '📺';
  $('active-country-name').textContent = country?.name || code;
  
  visibleCount = PAGE_SIZE;
  renderChannels();
}

function goBackToCountries() {
  clearSearchInput();
  currentCountry = null;
  $('channels-section').classList.add('hidden');
  $('channels-section').classList.remove('flex');
  $('countries-section').classList.remove('hidden');
  $('back-to-countries-btn').classList.add('hidden');
  setTab('countries');
  renderCountries(); // إعادة رسم كل الدول بدون أي فلتر سابقه
}

function resetToHome() {
  clearSearchInput();
  goBackToCountries();
  stopPlayback();
  renderCountries();
}

function getFilteredChannels() {
  const query = normalizeText($('global-search').value);
  const category = $('category-filter').value;
  let baseList = channels;
  
  if (currentTab === 'favorites') baseList = channels.filter(ch => favorites.includes(ch.id));
  else if (currentTab === 'countries' && currentCountry) baseList = channels.filter(ch => ch.country === currentCountry);

  let list = baseList.filter(ch => {
    const matchesQuery = !query || normalizeText(`${ch.name} ${(ch.categories||[]).join(' ')}`).includes(query);
    const matchesCategory = !category || (ch.categories||[]).some(cat => normalizeText(cat) === normalizeText(category));
    return matchesQuery && matchesCategory;
  });

  if ($('sort-filter').value === 'category') list.sort((a,b) => (a.categories?.[0]||'').localeCompare(b.categories?.[0]||''));
  else list.sort((a,b) => a.name.localeCompare(b.name));
  return list;
}

function setTab(tab) {
  clearSearchInput();
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.className = `tab-btn flex-1 py-1 rounded-lg text-[11px] font-semibold transition flex justify-center items-center gap-1 ${active?'bg-indigo-500 text-white shadow-sm':'muted hover:text-indigo-500'}`;
  });

  if (tab === 'countries') {
    currentCountry = null;
    $('countries-section').classList.remove('hidden');
    $('channels-section').classList.add('hidden');
    $('channels-section').classList.remove('flex');
    renderCountries(); // ضمان عودة كل الدول
  } else {
    $('countries-section').classList.add('hidden');
    $('channels-section').classList.remove('hidden');
    $('channels-section').classList.add('flex');
    $('back-to-countries-btn').classList.add('hidden');
    
    if (tab === 'all') {
      currentCountry = null;
      $('active-country-flag').textContent = '🌍';
      $('active-country-name').textContent = 'كل القنوات';
    } else if (tab === 'favorites') {
      currentCountry = null;
      $('active-country-flag').textContent = '❤️';
      $('active-country-name').textContent = 'المفضلة';
    }
  }
  visibleCount = PAGE_SIZE;
  renderChannels();
}

function renderChannels() {
  if (currentTab === 'countries' && !currentCountry) return; 

  const list = getFilteredChannels();
  const visible = list.slice(0, visibleCount);
  $('active-country-channels-count').textContent = `${list.length} قناة`;
  
  if (!list.length) {
    const msg = currentTab==='favorites' ? 'لم تضف قنوات للمفضلة.' : 'لا توجد قنوات مطابقة.';
    $('channels-list').innerHTML = `<div class="py-8 text-center muted text-xs font-medium card-surface rounded-xl"><i class="fa-solid fa-layer-group text-xl mb-1.5 block opacity-20"></i>${msg}</div>`;
    $('channels-footer').classList.add('hidden');
    return;
  }
  
  $('channels-list').innerHTML = visible.map(ch => {
    const isFav = favorites.includes(ch.id);
    const isActive = activeChannel && activeChannel.id === ch.id;
    const logo = ch.logo ? `<img src="${escapeHTML(ch.logo)}" alt="" loading="lazy" class="max-w-full max-h-full object-contain" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')">` : '';
    const fallback = `<div class="text-[10px] font-bold muted ${ch.logo?'hidden':''}">${escapeHTML(ch.name).substring(0,2).toUpperCase()}</div>`;
    const category = ch.categories?.[0] || 'عام';
    
    return `<article class="channel-strip card-surface border ${isActive?'border-indigo-500 bg-indigo-500/10':'border-transparent'} rounded-xl p-2 flex items-center justify-between gap-2 cursor-pointer group" data-play="${escapeHTML(ch.id)}" tabindex="0">
      <div class="flex items-center gap-2 flex-1 min-w-0">
        <div class="w-9 h-8 rounded-lg surface flex items-center justify-center shrink-0 overflow-hidden p-1">${logo}${fallback}</div>
        <div class="min-w-0 flex-1">
          <h3 class="font-bold text-[11px] truncate group-hover:text-indigo-500 transition-colors">${escapeHTML(ch.name)}</h3>
          <p class="text-[9px] muted truncate mt-0.5"><span class="surface px-1 py-0.2 rounded">${escapeHTML(category)}</span></p>
        </div>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button class="favorite-channel w-6 h-6 rounded-full hover:bg-rose-500/10 text-rose-500 flex items-center justify-center text-[11px] transition-colors" data-favorite="${escapeHTML(ch.id)}" title="المفضلة">
          <i class="${isFav?'fa-solid':'fa-regular'} fa-heart"></i>
        </button>
        <div class="w-6 h-6 rounded-full bg-indigo-500/10 text-indigo-500 flex items-center justify-center text-[9px] group-hover:bg-indigo-500 group-hover:text-white transition-colors">
          <i class="fa-solid fa-play"></i>
        </div>
      </div>
    </article>`;
  }).join('');
  
  $('channels-footer').classList.toggle('hidden', list.length <= visibleCount);
  $('channels-page-info').textContent = `يعرض ${visible.length} من ${list.length}`;
}

function updateFavoritesCount() { $('favorites-count').textContent = favorites.length; }
function toggleFavorite(id) {
  favorites = favorites.includes(id) ? favorites.filter(x => x !== id) : [...favorites, id];
  try { localStorage.setItem('palm_favorites_v2', JSON.stringify(favorites)); } catch {}
  updateFavoritesCount();
  document.querySelectorAll('.channel-strip').forEach(el => {
    if(el.dataset.play === id) el.querySelector('.favorite-channel i').className = `${favorites.includes(id)?'fa-solid':'fa-regular'} fa-heart`;
  });
  updateCurrentFavoriteButton();
}
function updateCurrentFavoriteButton() {
  if (!activeChannel) return;
  const isFav = favorites.includes(activeChannel.id);
  $('favorite-current-icon').className = `${isFav?'fa-solid':'fa-regular'} fa-heart text-rose-500`;
  $('favorite-current-label').textContent = isFav ? 'المفضلة' : 'المفضلة';
}

function stopPlayback() {
  if (hls) { hls.destroy(); hls = null; }
  clearTimeout(streamTimeout);
  const videoPlayer = $('video-player');
  videoPlayer.pause();
  videoPlayer.removeAttribute('src');
  videoPlayer.load();
  activeChannel = null;
  currentStreamIndex = 0;
  $('favorite-current').classList.add('hidden');
  $('refresh-player').classList.add('hidden');
  $('current-channel-tag').textContent = 'اختر قناة لبدء المشاهدة';
  setOverlay('جاهز للمشاهدة؟','اختر دولة ثم قناة من القائمة الجانبية.');
  setStatus('تم إيقاف البث');
  document.querySelectorAll('.channel-strip').forEach(el => {
    el.classList.remove('border-indigo-500', 'bg-indigo-500/10');
    el.classList.add('border-transparent');
  });
}

function playChannel(id) {
  const channel = channels.find(ch => ch.id === id);
  const streamList = streamsByChannel.get(id) || [];
  if (!channel || !streamList.length) return showToast('عذراً، لا يوجد رابط بث لهذه القناة.');
  
  activeChannel = {id, name:channel.name};
  currentStreamIndex = 0;
  $('current-channel-tag').textContent = channel.name;
  $('favorite-current').classList.remove('hidden');
  $('refresh-player').classList.remove('hidden');
  
  updateCurrentFavoriteButton();
  
  document.querySelectorAll('.channel-strip').forEach(el => {
    if (el.dataset.play === id) {
      el.classList.add('border-indigo-500', 'bg-indigo-500/10');
      el.classList.remove('border-transparent');
    } else {
      el.classList.remove('border-indigo-500', 'bg-indigo-500/10');
      el.classList.add('border-transparent');
    }
  });
  
  startStream();
}

function startStream() {
  if (!activeChannel) return;
  const streamList = streamsByChannel.get(activeChannel.id) || [];
  if (!streamList.length) return;

  if (hls) { hls.destroy(); hls = null; }
  clearTimeout(streamTimeout);

  const videoPlayer = $('video-player');
  videoPlayer.pause();
  videoPlayer.removeAttribute('src');
  videoPlayer.load();

  tryStream(streamList, currentStreamIndex);
}

function refreshCurrentStream() {
  if (!activeChannel) return;
  const streamList = streamsByChannel.get(activeChannel.id) || [];
  if (!streamList.length) return;

  showToast('جاري تحديث البث...');
  currentStreamIndex = (currentStreamIndex + 1) % streamList.length;
  startStream();
}

function tryStream(streamList, index) {
  if (index >= streamList.length) {
    setOverlay('البث غير متاح','جميع الروابط متوقفة حالياً.');
    setStatus('فشل التشغيل');
    return;
  }
  
  let url = streamList[index];
  setOverlay('جاري الاتصال...','يرجى الانتظار لحظات', true);
  setStatus(`جاري تشغيل المصدر ${index+1}...`);

  const videoPlayer = $('video-player');
  const isHls = /\.m3u8($|[?#])/i.test(url) || url.includes('.m3u8');
  let fallbackTriggered = false;

  const fallback = () => {
    if (fallbackTriggered) return;
    fallbackTriggered = true;
    clearTimeout(streamTimeout);
    if (hls) { hls.destroy(); hls = null; }
    currentStreamIndex = (index + 1) % streamList.length;
    tryStream(streamList, currentStreamIndex); 
  };

  streamTimeout = setTimeout(fallback, 8000);

  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60 });
    hls.loadSource(url);
    hls.attachMedia(videoPlayer);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      videoPlayer.play().then(() => {
        clearTimeout(streamTimeout);
        hideOverlay(); setStatus('البث يعمل بثبات');
      }).catch(() => {
        clearTimeout(streamTimeout);
        hideOverlay(); setStatus('اضغط علامة التشغيل');
      });
    });
    hls.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) fallback(); });
  } else {
    videoPlayer.src = url;
    videoPlayer.load();
    videoPlayer.play().then(() => {
      clearTimeout(streamTimeout);
      hideOverlay(); setStatus('البث يعمل بثبات');
    }).catch(() => {
      clearTimeout(streamTimeout);
      hideOverlay(); setStatus('اضغط تشغيل يدوياً');
    });
    videoPlayer.onerror = fallback;
  }
}

const themeToggle = $('theme-toggle');
const themeIcon = $('theme-icon');
function applyTheme(isLight) {
  document.documentElement.classList.toggle('light', isLight);
  document.documentElement.classList.toggle('dark', !isLight);
  themeIcon.className = isLight ? 'fa-solid fa-moon text-xs text-indigo-500' : 'fa-solid fa-sun text-xs text-yellow-400';
  localStorage.setItem('palm_theme', isLight ? 'light' : 'dark');
}
themeToggle.addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('light')));
if (localStorage.getItem('palm_theme') === 'light') applyTheme(true);

$('global-search').addEventListener('input', (e) => {
  const val = e.target.value;
  $('clear-global-search').classList.toggle('hidden', !val);
  if (currentTab === 'countries') { if (currentCountry) renderChannels(); else renderCountries(val); } else renderChannels();
});
$('clear-global-search').addEventListener('click', () => {
  clearSearchInput();
  if (currentTab === 'countries' && !currentCountry) renderCountries(); else renderChannels();
});
$('category-filter').addEventListener('change', renderChannels);
$('sort-filter').addEventListener('change', renderChannels);
$('load-more').addEventListener('click', () => { visibleCount += PAGE_SIZE; renderChannels(); });
$('favorite-current').addEventListener('click', () => { if (activeChannel) toggleFavorite(activeChannel.id); });
$('refresh-player').addEventListener('click', refreshCurrentStream);
$('stop-player').addEventListener('click', stopPlayback);
$('back-to-countries-btn').addEventListener('click', goBackToCountries);

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));

document.addEventListener('click', event => {
  const countryBtn = event.target.closest('[data-country]');
  if (countryBtn) return chooseCountry(countryBtn.dataset.country);
  const favBtn = event.target.closest('[data-favorite]');
  if (favBtn) { event.stopPropagation(); return toggleFavorite(favBtn.dataset.favorite); }
  const channelCard = event.target.closest('[data-play]');
  if (channelCard) return playChannel(channelCard.dataset.play);
});

init();
</script>
</body>
</html>
